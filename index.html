<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telegram Booking Service</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <script src="main.js?v=3" defer></script>

  <style>
    /* 3D core animation */
    .core {
      transform-style: preserve-3d;
      animation: float 8s ease-in-out infinite;
    }

    @keyframes float {
      0%,100% { transform: translateY(0) rotateX(0deg) rotateY(0deg); }
      50% { transform: translateY(-20px) rotateX(8deg) rotateY(-6deg); }
    }
  </style>
</head>

<body class="bg-black text-gray-100 font-sans overflow-x-hidden">

<!-- BACKGROUND (isolated, cannot cause scroll) -->
<div class="fixed inset-0 overflow-hidden pointer-events-none">
  <div class="absolute w-[600px] h-[600px] bg-blue-600/20 rounded-full blur-3xl
              left-1/2 top-[-200px] -translate-x-1/2"></div>

  <div class="absolute w-[500px] h-[500px] bg-cyan-500/20 rounded-full blur-3xl
              right-1/2 bottom-[-200px] translate-x-1/2"></div>
</div>

<!-- Language switch -->
<div class="fixed top-3 right-3 z-50 backdrop-blur bg-gray-900/70 p-2 rounded-xl border border-gray-700 flex gap-1">
  <button onclick="setLang('ru')" class="px-2 py-1 text-xs rounded hover:bg-gray-700">RU</button>
  <button onclick="setLang('uk')" class="px-2 py-1 text-xs rounded hover:bg-gray-700">UA</button>
  <button onclick="setLang('en')" class="px-2 py-1 text-xs rounded hover:bg-gray-700">EN</button>
</div>

<!-- HERO -->
<section class="min-h-screen flex flex-col items-center justify-center text-center px-6 relative z-10">

  <!-- 3D CORE -->
  <div class="mb-12 perspective-[1200px]">
    <div class="core relative w-64 h-64 rounded-3xl
                bg-gradient-to-br from-blue-500/30 to-cyan-400/10
                border border-blue-400/30 backdrop-blur-xl shadow-2xl">

      <div class="absolute inset-6 rounded-2xl bg-black/40 flex items-center justify-center text-sm text-cyan-300">
        Telegram Bot Core
      </div>

      <div class="absolute -inset-px rounded-3xl bg-gradient-to-r from-blue-500 to-cyan-400 opacity-20 blur-xl"></div>
    </div>
  </div>

  <h1 id="title" class="text-4xl sm:text-6xl font-extrabold tracking-tight max-w-3xl"></h1>
  <p id="subtitle" class="mt-4 text-lg sm:text-xl text-gray-400 max-w-2xl"></p>

  <a id="cta"
     href="https://t.me/ronkovalski"
     target="_blank"
     class="mt-8 inline-flex items-center gap-2 px-8 py-4 rounded-2xl
            bg-gradient-to-r from-blue-500 to-cyan-400 text-black font-semibold
            hover:scale-105 transition shadow-lg shadow-blue-500/30">
  </a>
</section>

<!-- CONTENT SECTIONS (same logic, no overflow) -->
<section class="px-6 py-20 relative z-10">
  <h2 id="usecasesTitle" class="text-3xl font-bold mb-12 text-center"></h2>
  <ul class="max-w-6xl mx-auto grid gap-8 md:grid-cols-3 list-none">
    <li class="bg-gray-900/70 p-8 rounded-3xl border border-gray-700"> <span id="uc1"></span> </li>
    <li class="bg-gray-900/70 p-8 rounded-3xl border border-gray-700"> <span id="uc2"></span> </li>
    <li class="bg-gray-900/70 p-8 rounded-3xl border border-gray-700"> <span id="uc3"></span> </li>
  </ul>
</section>

<section class="px-6 py-24 flex flex-col items-center text-center gap-6 relative z-10">
  <h2 id="ctaTitle" class="text-3xl font-bold"></h2>
  <p id="ctaText" class="text-gray-400 max-w-xl whitespace-pre-line"></p>

  <a id="ctaBtn"
     href="https://t.me/ronkovalski"
     target="_blank"
     class="mt-4 px-8 py-4 rounded-2xl
            bg-gradient-to-r from-blue-500 to-cyan-400 text-black font-semibold
            hover:scale-105 transition shadow-lg shadow-blue-500/30">
  </a>
</section>

</body>
</html>
