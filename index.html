<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telegram Booking Service</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="main.js?v=6" defer></script>

  <style>
    /* Fade-in (SAFE for mobile) */
    .fade-section {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    .fade-section.visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>

<body class="bg-black text-gray-100 font-sans overflow-x-hidden relative">

<!-- BACKGROUND GLOW -->
<div class="fixed inset-0 pointer-events-none overflow-hidden">
  <div class="absolute w-[420px] h-[420px] bg-blue-500/25 rounded-full blur-3xl -top-40 left-1/2 -translate-x-1/2"></div>
  <div class="absolute w-[360px] h-[360px] bg-cyan-400/20 rounded-full blur-3xl bottom-[-200px] right-1/2 translate-x-1/2"></div>
</div>

<!-- Language switch -->
<div class="fixed top-3 right-3 z-50 backdrop-blur bg-gray-900/70 p-2 rounded-xl border border-gray-700 flex gap-1">
  <button onclick="setLang('ru')" class="px-2 py-1 text-xs rounded hover:bg-gray-700">RU</button>
  <button onclick="setLang('uk')" class="px-2 py-1 text-xs rounded hover:bg-gray-700">UA</button>
  <button onclick="setLang('en')" class="px-2 py-1 text-xs rounded hover:bg-gray-700">EN</button>
</div>

<!-- HERO -->
<section class="min-h-screen flex flex-col items-center justify-center text-center px-6 relative z-10">
  <h1 id="title" class="text-4xl sm:text-6xl font-extrabold tracking-tight max-w-3xl fade-section"></h1>
  <p id="subtitle" class="mt-4 text-lg sm:text-xl text-gray-400 max-w-2xl fade-section"></p>

  <a id="cta"
     href="https://t.me/ronkovalski"
     target="_blank"
     class="mt-8 inline-flex items-center px-8 py-4 rounded-2xl
            bg-gradient-to-r from-blue-500 to-cyan-400
            text-black font-semibold
            shadow-lg shadow-blue-500/30
            active:scale-95 transition fade-section">
  </a>
</section>

<!-- USECASES -->
<section class="px-6 py-20 relative z-10">
  <h2 id="usecasesTitle" class="text-3xl font-bold mb-12 text-center fade-section"></h2>

  <ul class="max-w-6xl mx-auto grid gap-8 md:grid-cols-3 list-none">
    <li class="bg-gray-900/70 p-8 rounded-3xl border border-gray-700 fade-section"><span id="uc1"></span></li>
    <li class="bg-gray-900/70 p-8 rounded-3xl border border-gray-700 fade-section"><span id="uc2"></span></li>
    <li class="bg-gray-900/70 p-8 rounded-3xl border border-gray-700 fade-section"><span id="uc3"></span></li>
  </ul>
</section>

<!-- FEATURES -->
<section class="px-6 py-20 relative z-10">
  <h2 id="featuresTitle" class="text-3xl font-bold mb-12 text-center fade-section"></h2>

  <ul class="max-w-6xl mx-auto grid gap-8 md:grid-cols-2 list-none">
    <li class="bg-gray-900/70 p-8 rounded-3xl border border-gray-700 fade-section"><span id="f1"></span></li>
    <li class="bg-gray-900/70 p-8 rounded-3xl border border-gray-700 fade-section"><span id="f2"></span></li>
    <li class="bg-gray-900/70 p-8 rounded-3xl border border-gray-700 fade-section"><span id="f3"></span></li>
    <li class="bg-gray-900/70 p-8 rounded-3xl border border-gray-700 fade-section"><span id="f4"></span></li>
  </ul>
</section>

<!-- WHY -->
<section class="px-6 py-20 relative z-10">
  <h2 id="whyTitle" class="text-3xl font-bold mb-12 text-center fade-section"></h2>

  <ul class="max-w-6xl mx-auto grid gap-8 md:grid-cols-3 list-none">
    <li class="bg-gray-900/70 p-8 rounded-3xl border border-gray-700 fade-section">
      <h3 id="why1Title" class="font-semibold mb-2"></h3>
      <p id="why1Text" class="text-gray-400"></p>
    </li>
    <li class="bg-gray-900/70 p-8 rounded-3xl border border-gray-700 fade-section">
      <h3 id="why2Title" class="font-semibold mb-2"></h3>
      <p id="why2Text" class="text-gray-400"></p>
    </li>
    <li class="bg-gray-900/70 p-8 rounded-3xl border border-gray-700 fade-section">
      <h3 id="why3Title" class="font-semibold mb-2"></h3>
      <p id="why3Text" class="text-gray-400"></p>
    </li>
  </ul>
</section>

<!-- CTA -->
<section class="px-6 py-24 flex flex-col items-center text-center gap-6 relative z-10">
  <h2 id="ctaTitle" class="text-3xl font-bold fade-section"></h2>
  <p id="ctaText" class="text-gray-400 max-w-xl whitespace-pre-line fade-section"></p>

  <a id="ctaBtn"
     href="https://t.me/ronkovalski"
     target="_blank"
     class="mt-4 px-8 py-4 rounded-2xl
            bg-gradient-to-r from-blue-500 to-cyan-400
            text-black font-semibold
            shadow-lg shadow-blue-500/30
            active:scale-95 transition fade-section">
  </a>
</section>

<!-- Fade observer -->
<script>
  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => e.isIntersecting && e.target.classList.add('visible'));
  }, { threshold: 0.15 });

  document.querySelectorAll('.fade-section').forEach(el => observer.observe(el));
</script>

</body>
</html>
